name: "CI"

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Magic Nix Cache
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Run Nix Checks
        run: nix flake check -L
